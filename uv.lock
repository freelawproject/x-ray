    { name = "ipython", version = "8.39.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "ipython", version = "9.17.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "mypy" },
    { name = "pre-commit" },
    { name = "wheel" },
]

[package.metadata]
requires-dist = [
    { name = "httpx2", extras = ["http2"], specifier = ">=2.13.1" },
    { name = "pymupdf", specifier = "==1.24.14" },
]

[package.metadata.requires-dev]
dev = [
    { name = "ipython", marker = "python_full_version < '3.11'", specifier = ">=8.39.0" },
    { name = "ipython", marker = "python_full_version >= '3.11'", specifier = ">=9.17.1" },
    { name = "mypy", specifier = ">=2.4.0" },
    { name = "pre-commit", specifier = ">=4.6.2" },
    { name = "wheel", specifier = ">=0.48.0" },
]
