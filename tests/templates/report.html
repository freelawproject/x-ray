<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>x-ray benchmarks</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: monospace;
      padding: 2rem;
      background: #fafaf9;
      color: #1c1917;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
      color: #000;
      font-weight: bold;
    }

    h2 {
      font-size: 1.1rem;
      margin: 2rem 0 0.75rem;
      color: #000;
      font-weight: bold;
      border-top: 4px solid #000;
      padding-top: 1rem;
    }

    .summary {
      color: #1c1917;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .empty {
      color: #555;
      font-size: 0.85rem;
      font-style: italic;
    }

    .chart-wrap {
      background: #fff;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 1rem;
      margin-bottom: 1rem;
      position: relative;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: #fff;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      margin-bottom: 2rem;
    }

    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      background: #000;
      color: #fff;
      font-size: 0.85rem;
      border-right: 1px solid #333;
      cursor: pointer;
      user-select: none;
    }

    th.num {
      text-align: right;
    }

    th:hover {
      background: #222;
    }

    td {
      padding: 0.5rem 0.75rem;
      border-bottom: 2px solid #000;
      vertical-align: top;
      font-size: 0.85rem;
      border-right: 1px solid #000;
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .filename {
      color: #1c1917;
      font-weight: bold;
    }

    .ok {
      color: #15803d;
      font-weight: bold;
    }

    .gain {
      color: #15803d;
      font-weight: bold;
    }

    .loss {
      color: #b91c1c;
      font-weight: bold;
    }

    details summary {
      cursor: pointer;
      color: #1c1917;
      font-weight: bold;
      text-decoration: underline;
    }

    .redaction {
      margin: 0.25rem 0;
      padding: 0.25rem 0.5rem;
      border: 2px solid #000;
      box-shadow: 2px 2px 0 #000;
    }

    .redaction.gain {
      background: #4ade80;
    }

    .redaction.loss {
      background: #fca5a5;
    }

    .bbox {
      color: #555;
      font-size: 0.8rem;
    }

    .accuracy-charts {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .accuracy-charts .chart-wrap {
      flex: 0 0 280px;
    }

    .chart-gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .gallery-item h3 {
      font-size: 0.95rem;
      font-weight: bold;
      margin: 0 0 0.25rem;
      color: #000;
      border-bottom: 2px solid #000;
      padding-bottom: 0.25rem;
    }

    .chart-desc {
      font-size: 0.8rem;
      color: #555;
      margin: 0 0 0.5rem;
      font-style: italic;
    }
  </style>
</head>

<body>
  <h1>x-ray benchmarks</h1>
  <p class="summary">{{ meta }}</p>
  {% if perf_data %}<h2>Performance</h2>
  {% include "perf_section.html" %}{% endif %}
  <h2>Accuracy</h2>
  {% include "accuracy_section.html" %}
  <script>
    function makeSortable(table) {
      const ths = table.querySelectorAll('th');
      let col = -1, asc = true;
      ths.forEach((th, i) => {
        th.addEventListener('click', () => {
          asc = col === i ? !asc : true;
          col = i;
          const tbody = table.querySelector('tbody');
          const rows = [...tbody.querySelectorAll('tr')];
          rows.sort((a, b) => {
            const av = a.cells[i].textContent.trim().replace(/[+▲▼%]/g, '');
            const bv = b.cells[i].textContent.trim().replace(/[+▲▼%]/g, '');
            const an = parseFloat(av), bn = parseFloat(bv);
            const cmp = isNaN(an) || isNaN(bn) ? av.localeCompare(bv) : an - bn;
            return asc ? cmp : -cmp;
          });
          rows.forEach(r => tbody.appendChild(r));
          ths.forEach(h => { h.textContent = h.textContent.replace(/ [▲▼]$/, ''); });
          th.textContent += asc ? ' ▲' : ' ▼';
        });
      });
    }
    document.querySelectorAll('table').forEach(makeSortable);
  </script>
</body>

</html>
